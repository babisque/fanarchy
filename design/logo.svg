<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Fanarchy logo">
  <title>Fanarchy</title>
  <!-- Stenciled ring: four gaps at 0°, 90°, 180°, 270° -->
  <circle cx="50" cy="52" r="40" fill="none" stroke="#E23B2E" stroke-width="9" stroke-dasharray="58.83 4" stroke-dashoffset="60.83"/>
  <!-- Stenciled A: split at the apex and in the crossbar -->
  <g stroke="#E23B2E" stroke-width="10" fill="none">
    <line x1="15" y1="96" x2="47.5" y2="6"/>
    <line x1="52.5" y1="6" x2="85" y2="96"/>
    <line x1="28" y1="70" x2="47.5" y2="70"/>
    <line x1="52.5" y1="70" x2="72" y2="70"/>
  </g>
  <!-- Three-blade fan -->
  <g fill="#121211">
    <path d="M50 52 C43 44 41 33 49 29 C58 26 63 37 56 46 Z"/>
    <path d="M50 52 C43 44 41 33 49 29 C58 26 63 37 56 46 Z" transform="rotate(120 50 52)"/>
    <path d="M50 52 C43 44 41 33 49 29 C58 26 63 37 56 46 Z" transform="rotate(240 50 52)"/>
  </g>
  <circle cx="50" cy="52" r="6.5" fill="#121211" stroke="#ECE8DE" stroke-width="2.4" stroke-dasharray="9 1.2"/>
</svg>
